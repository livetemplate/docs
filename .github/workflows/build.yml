name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # `go install github.com/livetemplate/tinkerdown/cmd/tinkerdown@latest`
      # is broken: the published module ZIP excludes internal/assets/vendor/*
      # (mermaid.min.js exceeds Go's per-file size limit) so the embed.FS
      # directive fails to compile. Build from source until upstream fixes it.
      - name: Build tinkerdown from source
        run: |
          git clone --depth=1 https://github.com/livetemplate/tinkerdown.git /tmp/tk
          cd /tmp/tk
          go build -o /usr/local/bin/tinkerdown ./cmd/tinkerdown
          tinkerdown version

      - name: Validate content
        run: tinkerdown validate content/

      - name: Test sync tool
        working-directory: cmd/sync
        run: go test ./... -count=1

  # Browser-backed e2e against the REAL stack. Builds the same multi-stage
  # Dockerfile prod ships (tinkerdown + recipes binary, TINKERDOWN_REF pinned),
  # runs the container, and points the chromedp suite at it on :8080 — exactly
  # how the suite runs against prod, just localhost. This is the gate that
  # catches landing/IA/content changes breaking embeds, theme, or layout
  # (validate alone can't — it never renders in a browser).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # The Dockerfile encodes the full stack build (client assets → tinkerdown
      # binary → recipes binary → entrypoint that starts both). Reuse it rather
      # than re-deriving the build here, so CI can't drift from prod.
      - name: Build the docs stack image
        run: docker build -t docs-e2e .

      - name: Start the stack
        run: |
          # GREET_WALL_SERVER_INTERVAL drives the greet-wall Step-7 heartbeat
          # fast so TestSpineServerPush can assert the server-initiated push
          # without waiting the 30s prod default.
          docker run -d --name docs -p 8080:8080 -e GREET_WALL_SERVER_INTERVAL=2s docs-e2e
          # Poll until tinkerdown serves the home page (recipes binary + proxy
          # are up by then). Fail fast with logs if it never comes up.
          for i in $(seq 1 45); do
            if curl -fsS -o /dev/null http://localhost:8080/; then
              echo "stack is up"; exit 0
            fi
            sleep 2
          done
          echo "stack did not become ready in time"; docker logs docs; exit 1

      # ubuntu-latest ships google-chrome-stable; chromedp's default allocator
      # finds it on PATH. The suite already sets headless + --no-sandbox.
      - name: Run e2e suite
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: go test ./... -count=1 -timeout 600s

      - name: Container logs on failure
        if: failure()
        run: docker logs docs

  # Upload-modes browser e2e (docs#77). Not part of the job above: that suite
  # drives the docs SITE, while this one boots examples/upload-modes directly
  # and exercises all four upload destinations plus the WebSocket-disabled
  # fallbacks. It needs a real client bundle on disk because the modes are a
  # client-side transport decision — the server config alone cannot be tested.
  #
  # The bundle is fetched at livetemplate.ClientVersion, the exact version
  # {{lvtClientScriptURL}} serves, so this also guards the pairing: a Go
  # dependency bump that moves ClientVersion to a client which breaks uploads
  # fails here rather than in production.
  upload-modes-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch the pinned client bundle
        run: |
          VER="$(go run ./cmd/clientversion)"
          echo "pinned @livetemplate/client version: $VER"
          npm pack "@livetemplate/client@${VER}"
          tar -xzf livetemplate-client-*.tgz
          BUNDLE="$PWD/package/dist/livetemplate-client.browser.js"
          test -s "$BUNDLE" || { echo "bundle missing from the npm tarball"; exit 1; }
          echo "LVT_LOCAL_CLIENT=$BUNDLE" >> "$GITHUB_ENV"

      # The suite allocates Chrome via LVT_CHROME (default "chromium", which
      # ubuntu-latest does not ship); google-chrome-stable is present.
      - name: Run upload-modes browser e2e
        env:
          LVT_UPLOAD_MODES_E2E: '1'
          LVT_CHROME: google-chrome-stable
        run: go test ./examples/upload-modes/... -count=1 -v -timeout 600s
